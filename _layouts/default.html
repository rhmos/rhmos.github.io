<!DOCTYPE html>
<html lang="en" data-theme="dark">
{% include head.html %}
<body>
  <div class="bg-pattern" aria-hidden="true"></div>
  {% include blossoms.html %}
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main" class="container">
    {{ content }}
  </main>
  {% include footer.html %}
  <script>
    (function () {
      var root = document.documentElement;
      var button = document.querySelector('.theme-toggle');
      function sync() {
        var dark = root.getAttribute('data-theme') === 'dark';
        button.setAttribute('aria-pressed', dark);
        button.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
      }
      function apply(next) {
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        sync();
      }
      // Tracked separately so a second click during the transition, before the page has
      // switched, still toggles back.
      var current = root.getAttribute('data-theme');
      // The new theme grows out of the button as an expanding circle, where the browser
      // supports view transitions; otherwise (or with reduced motion) it switches at once.
      button.addEventListener('click', function () {
        var next = current = current === 'dark' ? 'light' : 'dark';
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!document.startViewTransition || reduce) { apply(next); return; }

        // Circle centre and final radius as percentages of the window (a circle's radius % is
        // of the diagonal / √2), so they hold however the browser scales the page snapshot.
        var w = innerWidth, h = innerHeight, box = button.getBoundingClientRect();
        var x = box.left + box.width / 2, y = box.top + box.height / 2;
        var at = ' at ' + (100 * x / w) + '% ' + (100 * y / h) + '%)';
        // Radius that reaches the farthest corner of the window
        var r = Math.hypot(Math.max(x, w - x), Math.max(y, h - y)) / (Math.hypot(w, h) / Math.SQRT2);
        var transition = document.startViewTransition(function () { apply(next); });
        transition.ready.then(function () {
          root.animate(
            { clipPath: ['circle(0%' + at, 'circle(' + (100 * r) + '%' + at] },
            { duration: 800, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', pseudoElement: '::view-transition-new(root)' }
          );
        });
      });
      sync();
    })();

    (function () {
      var root = document.documentElement;
      var button = document.querySelector('.petal-toggle');
      var svg = document.querySelector('.bg-blossoms');
      if (!button || !svg) return;
      function sync() { button.setAttribute('aria-pressed', !root.classList.contains('petals-off')); }

      // Each petal's place in the scatter, read from its transform attribute:
      // translate(x y) rotate(r) scale(sx sy), with its opacity (if any) beside it.
      var petals = [].map.call(svg.querySelectorAll('use'), function (el) {
        var n = el.getAttribute('transform').match(/-?[\d.]+/g).map(Number);
        return { el: el, x: n[0], y: n[1], r: n[2], sx: n[3], sy: n[4],
                 o: +(el.getAttribute('opacity') || 1), d: Math.hypot(n[0] / 1.25, n[1]) };
      });
      function place(x, y, r, sx, sy) {
        return 'translate(' + x + 'px, ' + y + 'px) rotate(' + r + 'deg) scale(' + sx + ', ' + sy + ')';
      }
      function rand(a, b) { return a + Math.random() * (b - a); }

      // Off: every petal tumbles down, drifting a little sideways, and fades as it goes.
      function fall(p) {
        var from = +getComputedStyle(p.el).opacity;   // where it is, if it was still fading in
        p.el.getAnimations().forEach(function (a) { a.cancel(); });
        var drop = rand(160, 380), drift = rand(-10, 50), sway = rand(-20, 20), spin = rand(-90, 90);
        return p.el.animate([
          { transform: place(p.x, p.y, p.r, p.sx, p.sy), opacity: from },
          { transform: place(p.x + drift * 0.3 + sway, p.y + drop * 0.35, p.r + spin * 0.4,
                             p.sx * (Math.random() < 0.5 ? -0.5 : 0.4), p.sy), opacity: from, offset: 0.35 },
          { transform: place(p.x + drift, p.y + drop, p.r + spin, p.sx, p.sy), opacity: 0 }
        ], { duration: rand(1300, 2200), delay: rand(0, 600), easing: 'ease-in', fill: 'both' });
      }
      // On: the petals open out from the corner, nearest first, each growing into place.
      function bloom(p) {
        p.el.getAnimations().forEach(function (a) { a.cancel(); });
        return p.el.animate([
          { transform: place(p.x * 0.8, p.y * 0.8, p.r - 30, p.sx * 0.4, p.sy * 0.4), opacity: 0 },
          { transform: place(p.x, p.y, p.r, p.sx, p.sy), opacity: p.o }
        ], { duration: 900, delay: Math.min(p.d, 700) * 1.7, easing: 'cubic-bezier(0.2, 0.6, 0.3, 1)', fill: 'backwards' });
      }

      var run = 0;   // so a click mid-animation takes over from the one before
      button.addEventListener('click', function () {
        // The button, not the class, says where things are headed: the class only goes on once
        // the petals have finished falling.
        var off = button.getAttribute('aria-pressed') === 'true';
        var mine = ++run;
        button.setAttribute('aria-pressed', !off);
        try { localStorage.setItem('petals', off ? 'off' : 'on'); } catch (e) {}
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !svg.animate) {
          root.classList.toggle('petals-off', off);
          return;
        }
        if (!off) { root.classList.remove('petals-off'); petals.forEach(bloom); return; }
        var falls = petals.map(fall);
        Promise.all(falls.map(function (a) { return a.finished; })).then(function () {
          if (mine !== run) return;
          root.classList.add('petals-off');
          falls.forEach(function (a) { a.cancel(); });
        }, function () {});
      });
      sync();
    })();
  </script>
</body>
</html>
