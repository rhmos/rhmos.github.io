# Education & Experience page content.
#
# Each entry can have:
#   title     – degree or job title (required)
#   place     – university or organisation
#   location  – city, country
#   start     – start year (leave out for single-date items such as awards)
#   end       – end year; leave out to show "present"
#   details   – optional Markdown: thesis, supervisor, bullet points, links…
#   logo      – optional image shown beside the entry, e.g. /assets/img/logos/logo.png
#   logo_url  – optional web address the logo links to
#   logo_name – optional name for the logo's tooltip (defaults to place)
#   logo_secondary, logo_secondary_url, logo_secondary_name
#             – optional second logo that pops out to the right when the first is hovered
#
# Entries are shown in the order written here, so put the most recent first.

