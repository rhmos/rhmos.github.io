{%- comment -%}
  TEST: a floating button that closes every opened card on the page. It shows only while a card
  is open: in the margin left of the cards on wide screens, in the bottom-right corner otherwise.
  Pages turn it on with `collapse_all: true` in their front matter.
{%- endcomment -%}
<button class="collapse-all" type="button" aria-label="Collapse all cards" title="Collapse all cards" hidden>
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7 4 5 5 5-5M7 20l5-5 5 5"/></svg>
</button>
<script>
  (function () {
    var button = document.querySelector('.collapse-all');
    var cards = document.querySelectorAll('main details');
    if (!button || !cards.length) return;
    button.hidden = false;
    function sync() {
      var any = [].some.call(cards, function (d) { return d.open; });
      button.classList.toggle('is-shown', any);
      button.tabIndex = any ? 0 : -1;
    }
    // toggle events don't bubble, so listen for them on the way down
    document.addEventListener('toggle', sync, true);

    button.addEventListener('click', function () {
      // Keep the card at the top of the window in place, so the page doesn't jump under the reader
      var anchor = [].find.call(cards, function (d) { return d.getBoundingClientRect().bottom > 0; });
      var before = anchor && anchor.getBoundingClientRect().top;
      [].forEach.call(cards, function (d) { d.open = false; });
      if (anchor) {
        var after = anchor.getBoundingClientRect().top;
        window.scrollTo(0, window.scrollY + after - Math.max(before, 24));
      }
      button.blur();
    });
    sync();
  })();
</script>
