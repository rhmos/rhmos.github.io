<header class="site-header">
  <div class="container header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <div class="header-right">
      <nav class="site-nav" aria-label="Main">
        <ul>
          {%- for item in site.data.navigation %}
          <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
          {%- endfor %}
        </ul>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch to light mode" title="Toggle light/dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="petal-toggle" type="button" aria-pressed="true" aria-label="Cherry blossom petals" title="Toggle the petals">
        <svg viewBox="-8 -14 16 15" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round">
          <path d="M0 0 C-6 -2 -8 -9 -4 -12.5 Q-2 -13.5 0 -11.5 Q2 -13.5 4 -12.5 C8 -9 6 -2 0 0 Z"/>
        </svg>
      </button>
    </div>
  </div>
</header>
